<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block; margin:auto;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="800" height="160" fill="#0b1020" rx="16" />
  <text x="400" y="30" text-anchor="middle" fill="#e8eefc" font-size="18" font-family="Inter, 'Microsoft YaHei', sans-serif" font-weight="600">算法流程图</text>

  <g>
    <rect x="20" y="65" width="118" height="70" rx="10" fill="#141b2e" stroke="#2a3558" stroke-width="2" />
    <text x="79" y="100" text-anchor="middle" fill="#e8eefc" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif">输入视频</text>
    <text x="79" y="120" text-anchor="middle" fill="#8b97b8" font-size="11" font-family="Inter, 'Microsoft YaHei', sans-serif">G1 / 人体</text>
  </g>

  <g>
    <rect x="153" y="65" width="118" height="70" rx="10" fill="#141b2e" stroke="#2a3558" stroke-width="2" />
    <text x="212" y="100" text-anchor="middle" fill="#e8eefc" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif">标准姿态</text>
    <text x="212" y="120" text-anchor="middle" fill="#8b97b8" font-size="11" font-family="Inter, 'Microsoft YaHei', sans-serif">8 个角度特征</text>
  </g>

  <g>
    <rect x="286" y="65" width="118" height="70" rx="10" fill="#141b2e" stroke="#2a3558" stroke-width="2" />
    <text x="345" y="100" text-anchor="middle" fill="#e8eefc" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif">DTW 对齐</text>
    <text x="345" y="120" text-anchor="middle" fill="#8b97b8" font-size="11" font-family="Inter, 'Microsoft YaHei', sans-serif">时间规整</text>
  </g>

  <g>
    <rect x="419" y="65" width="118" height="70" rx="10" fill="#141b2e" stroke="#2a3558" stroke-width="2" />
    <text x="478" y="100" text-anchor="middle" fill="#e8eefc" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif">差值计算</text>
    <text x="478" y="120" text-anchor="middle" fill="#8b97b8" font-size="11" font-family="Inter, 'Microsoft YaHei', sans-serif">逐特征差距</text>
  </g>

  <g>
    <rect x="552" y="65" width="118" height="70" rx="10" fill="#141b2e" stroke="#2a3558" stroke-width="2" />
    <text x="611" y="100" text-anchor="middle" fill="#e8eefc" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif">排序</text>
    <text x="611" y="120" text-anchor="middle" fill="#8b97b8" font-size="11" font-family="Inter, 'Microsoft YaHei', sans-serif">误差 × 置信度</text>
  </g>

  <g>
    <rect x="685" y="65" width="95" height="70" rx="10" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" />
    <text x="732" y="100" text-anchor="middle" fill="#0b1020" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif" font-weight="600">主误差</text>
    <text x="732" y="120" text-anchor="middle" fill="#0b1020" font-size="13" font-family="Inter, 'Microsoft YaHei', sans-serif" font-weight="600">输出</text>
  </g>

  <line x1="138" y1="100" x2="153" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="271" y1="100" x2="286" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="404" y1="100" x2="419" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="537" y1="100" x2="552" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="670" y1="100" x2="685" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
</svg>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G1 23DoF 对标教练</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #141b2e;
        --line: #2a3558;
        --ok: #3ee08f;
        --bad: #ff5d6c;
        --warn: #ffc857;
        --text: #e8eefc;
        --muted: #8b97b8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr 1fr 320px;
        grid-template-rows: 1fr 170px;
        height: 100%;
        gap: 14px;
        padding: 14px;
      }
      .stage {
        position: relative;
        background: #070b16;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        min-height: 0;
      }
      .tag {
        position: absolute;
        z-index: 3;
        left: 12px;
        top: 12px;
        background: rgba(7, 11, 22, 0.75);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 12px;
        color: var(--muted);
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }
      .mirror {
        transform: scaleX(-1);
      }
      canvas {
        z-index: 1;
        pointer-events: none;
      }
      .side {
        grid-row: span 2;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        overflow: auto;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .metric {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 13px;
      }
      .metric b {
        font-variant-numeric: tabular-nums;
      }
      .feedback {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.4;
        min-height: 50px;
      }
      .feedback.ok {
        color: var(--ok);
      }
      .feedback.bad {
        color: var(--bad);
      }
      .feedback.wait {
        color: var(--warn);
      }
      .prompt {
        position: sticky;
        top: 14px;
        z-index: 10;
        border: 2px solid var(--warn);
        box-shadow: 0 0 20px rgba(255, 200, 87, 0.15);
      }
      .talk-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        min-height: 18px;
      }
      .skill-track {
        width: 100%;
        height: 6px;
        background: #2a3558;
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }
      .skill-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        transition: width 0.15s;
      }
      .report-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(7, 11, 22, 0.92);
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .report-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        width: min(720px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.5rem;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }
      .report-card h2 { margin: 0 0 0.5rem; color: var(--sky); }
      .report-score { font-size: 3rem; font-weight: 700; color: var(--ok); margin: 0; }
      .report-comment { color: var(--muted); margin: 0 0 1rem; }
      .report-parts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 1rem 0; }
      .report-parts div { background: var(--bg); padding: 0.6rem; border-radius: 10px; display: flex; justify-content: space-between; }
      .report-parts span { font-weight: 700; color: var(--sky); }
      .report-suggestions { margin: 0; padding-left: 1.2rem; }
      .report-suggestions li { margin: 0.4rem 0; color: var(--text); }
      .report-tip { color: var(--muted); font-size: 0.9rem; margin-top: 1rem; }
      .report-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
      .report-actions button { flex: 1; }
      .tl-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
      .tl-cell { flex: 1 0 100px; min-height: 78px; border-radius: 10px; padding: 0.5rem; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
      .tl-cell.ok { background: var(--ok); }
      .tl-cell.warn { background: var(--warn); color: var(--bg); }
      .tl-cell.bad { background: var(--bad); }
      .tl-time { font-size: 0.75rem; opacity: 0.9; font-weight: 500; }
      .tl-prompt { font-size: 11px; line-height: 1.25; margin-top: 0.3rem; }
      @media print {
        body * { visibility: hidden; }
        .report-modal, .report-modal * { visibility: visible; }
        .report-modal { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: flex !important; background: #fff; color: #000; }
        .report-card { box-shadow: none; border: none; width: 100%; max-height: none; overflow: visible; color: #000; }
        .report-actions { display: none; }
      }
      .data-panel {
        grid-column: 1 / 3;
        grid-row: 2;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px 14px;
        min-height: 0;
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 12px;
        align-items: stretch;
      }
      .data-panel .metrics {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
      }
      .data-panel .metrics .metric b {
        font-variant-numeric: tabular-nums;
      }
      #errorChart {
        min-height: 0;
        height: 100%;
        border-radius: 10px;
        overflow: hidden;
      }
      button,
      .file {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 8px 11px;
        background: #3d6dff;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      button.ghost {
        background: #243056;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .file {
        display: block;
        text-align: center;
        background: #243056;
      }
      input[type="file"] {
        display: none;
      }
      select {
        margin-top: 8px;
        width: 100%;
        background: #0d1324;
        color: #e8eefc;
        border: 1px solid #2a3558;
        border-radius: 8px;
        padding: 8px;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      @media (max-width: 1100px) {
        .wrap {
          grid-template-columns: 1fr;
          grid-template-rows: 28vh 28vh auto;
        }
      }
      #videoSelect {
        width: 100%;
        min-height: 140px;
        font-size: 15px;
        padding: 6px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        margin-top: 6px;
      }
      #videoSelect option {
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 3px;
      }
      #videoSelect option:checked {
        background: var(--ok);
        color: var(--bg);
      }
      #videoSelect:focus {
        border-color: var(--ok);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="stage">
        <div class="tag">G1 23DoF 参考 · 12 点</div>
        <video id="robot" class="mirror" playsinline muted loop></video>
        <canvas id="robotOverlay" class="mirror"></canvas>
      </div>
      <div class="stage">
        <div class="tag">你 · 实时对标 · 12 点</div>
        <video id="cam" class="mirror" playsinline autoplay muted></video>
        <canvas id="camOverlay" class="mirror"></canvas>
      </div>
      <aside class="side">
        <div class="card">
          <h1>G1 23DoF 动作对标</h1>
          <p>
            只比 12 个点。机器人画面左边举手，你举右手。提示按你要举的那只手说。
          </p>
          <div class="status" id="status">
            请从下方列表选择一个视频，再开摄像头。
          </div>
        </div>

        <div class="card prompt">
          <div class="feedback wait" id="talk">
            选视频 → 开摄像头 → 开始对标
          </div>
          <div class="talk-meta" id="talkMeta"></div>
          <div class="skill-track">
            <div class="skill-fill" id="skillFill"></div>
          </div>
        </div>

        <label class="file">选择 G1 参考视频</label>
        <select id="videoSelect" size="5">
          <option value="">— 选择示例视频 —</option>
          <option value="../videos/1.mp4">1.mp4</option>
          <option value="../videos/J_ShortDance14_Disco_training.mp4">J_ShortDance14_Disco_training.mp4</option>
          <option value="../videos/J_ShortDance15_Nineties_training.mp4">J_ShortDance15_Nineties_training.mp4</option>
          <option value="../videos/boxing.mp4">boxing.mp4</option>
          <option value="../videos/dance.mp4">dance.mp4</option>
        </select>
        <button id="camBtn" type="button">打开彩色摄像头</button>
        <button id="goBtn" class="ghost" type="button" disabled>
          开始对标
        </button>
        <button id="stopBtn" type="button" disabled style="background: #ff5d6c;">
          停止对标
        </button>
        <a class="file" href="../error_detection/frontend/index-zh.html"
          >Error Detection Visualizer</a
        >
        <a class="file" href="../error_detection/frontend/how-it-works-zh.html"
          >算法说明</a
        >
        <a class="file" href="../README.md">项目说明</a>
        <a class="file" href="../QUICKSTART.md">快速开始</a>
        <select id="camSelect" style="display: none"></select>
        <!-- real-time metrics and chart moved to the data panel -->
      </aside>

      <div class="data-panel">
        <div class="metrics">
          <div class="metric">你右手 / 机器人画面左 <b id="rPunch">-- / --</b></div>
          <div class="metric">你左手 / 机器人画面右 <b id="lPunch">-- / --</b></div>
          <div class="metric">你右腿 / 机器人画面左腿 <b id="rKick">-- / --</b></div>
          <div class="metric">你左腿 / 机器人画面右腿 <b id="lKick">-- / --</b></div>
        </div>
        <div id="errorChart">
          <h3 style="margin:0 0 0.5rem 0;font-size:14px;color:#8b97b8;">实时误差指标</h3>
          <div style="color:#8b97b8;font-size:13px;">点击“开始对标”后显示</div>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        PoseLandmarker,
        FilesetResolver,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/+esm";

      const L_SH = 11,
        R_SH = 12,
        L_EL = 13,
        R_EL = 14,
        L_WR = 15,
        R_WR = 16;
      const L_HIP = 23,
        R_HIP = 24,
        L_KN = 25,
        R_KN = 26,
        L_ANK = 27,
        R_ANK = 28;
      const BODY12 = [
        L_SH,
        R_SH,
        L_EL,
        R_EL,
        L_WR,
        R_WR,
        L_HIP,
        R_HIP,
        L_KN,
        R_KN,
        L_ANK,
        R_ANK,
      ];
      const BONES = [
        [L_SH, R_SH],
        [L_SH, L_EL],
        [L_EL, L_WR],
        [R_SH, R_EL],
        [R_EL, R_WR],
        [L_SH, L_HIP],
        [R_SH, R_HIP],
        [L_HIP, R_HIP],
        [L_HIP, L_KN],
        [L_KN, L_ANK],
        [R_HIP, R_KN],
        [R_KN, R_ANK],
      ];
      const GOOGLE_MODEL =
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

      const robot = document.getElementById("robot");
      const cam = document.getElementById("cam");
      const robotCanvas = document.getElementById("robotOverlay");
      const camCanvas = document.getElementById("camOverlay");
      const robotCtx = robotCanvas.getContext("2d");
      const camCtx = camCanvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const talkEl = document.getElementById("talk");
      const talkMetaEl = document.getElementById("talkMeta");
      const skillFillEl = document.getElementById("skillFill");
      const goBtn = document.getElementById("goBtn");

      let robotLm = null;
      let camLm = null;
      let lastTalkAt = 0;
      let running = false;
      let lastRobotT = -1;
      let lastCamT = -1;
      let g1History = [];
      let youHistory = [];
      let pendingErr = null;
      let danceLog = [];

      function setTalk(text, kind) {
        talkEl.textContent = text;
        talkEl.className = `feedback ${kind}`;
      }

      function vis(lm, i) {
        return (lm[i].visibility ?? 1) > 0.55;
      }

      function torso(lm) {
        const hx = (lm[L_HIP].x + lm[R_HIP].x) / 2;
        const hy = (lm[L_HIP].y + lm[R_HIP].y) / 2;
        const sx = (lm[L_SH].x + lm[R_SH].x) / 2;
        const sy = (lm[L_SH].y + lm[R_SH].y) / 2;
        return Math.max(0.08, Math.hypot(hx - sx, hy - sy));
      }

      function metrics(lm) {
        if (!lm) return null;
        const s = torso(lm);
        const punch = (sh, wr) =>
          vis(lm, sh) && vis(lm, wr) ? (lm[sh].y - lm[wr].y) / s : null;
        const kick = (hip, ank) =>
          vis(lm, hip) && vis(lm, ank) ? (lm[hip].y - lm[ank].y) / s : null;
        return {
          rPunch: punch(R_SH, R_WR),
          lPunch: punch(L_SH, L_WR),
          rKick: kick(R_HIP, R_ANK),
          lKick: kick(L_HIP, L_ANK),
          rReach:
            vis(lm, R_SH) && vis(lm, R_WR)
              ? Math.abs(lm[R_WR].x - lm[R_SH].x) / s
              : null,
          lReach:
            vis(lm, L_SH) && vis(lm, L_WR)
              ? Math.abs(lm[L_WR].x - lm[L_SH].x) / s
              : null,
        };
      }

      function fmt(v) {
        return v == null || Number.isNaN(v) ? "--" : v.toFixed(2);
      }

      function mpOnScreenLeft(lm, leftIdx, rightIdx) {
        if (!lm) return true;
        const l = lm[leftIdx].x;
        const r = lm[rightIdx].x;
        return l > r;
      }

      const FEATURE_IMPORTANCE = {
        right_arm_elevation: 1.0,
        left_arm_elevation: 1.0,
        right_arm_reach: 0.8,
        left_arm_reach: 0.8,
        right_leg_elevation: 0.7,
        left_leg_elevation: 0.7,
      };

      function visualChecks(lm) {
        const armLeftIsMpLeft = mpOnScreenLeft(lm, L_WR, R_WR);
        const legLeftIsMpLeft = mpOnScreenLeft(lm, L_ANK, R_ANK);
        const arm = armLeftIsMpLeft
          ? {
              screenL: "lPunch",
              screenR: "rPunch",
              reachL: "lReach",
              reachR: "rReach",
            }
          : {
              screenL: "rPunch",
              screenR: "lPunch",
              reachL: "rReach",
              reachR: "lReach",
            };
        const leg = legLeftIsMpLeft
          ? { screenL: "lKick", screenR: "rKick" }
          : { screenL: "rKick", screenR: "lKick" };
        const map = [
          { g1: arm.screenL, you: "rPunch", text: "再高一点", partName: "右手", feature: "right_arm_elevation", min: 0.16, threshold: 0.5 },
          { g1: arm.screenR, you: "lPunch", text: "再高一点", partName: "左手", feature: "left_arm_elevation", min: 0.16, threshold: 0.5 },
          { g1: arm.reachL, you: "rReach", text: "再伸出去", partName: "右手", feature: "right_arm_reach", min: 0.20, threshold: 0.5 },
          { g1: arm.reachR, you: "lReach", text: "再伸出去", partName: "左手", feature: "left_arm_reach", min: 0.20, threshold: 0.5 },
          { g1: leg.screenL, you: "rKick", text: "再高一点", partName: "右腿", feature: "right_leg_elevation", min: 0.12, threshold: 0.5 },
          { g1: leg.screenR, you: "lKick", text: "再高一点", partName: "左腿", feature: "left_leg_elevation", min: 0.12, threshold: 0.5 },
        ];
        return map.map((s) => ({
          ...s,
          importance: FEATURE_IMPORTANCE[s.feature],
        }));
      }

      function rememberG1(g1, t) {
        if (!g1) return;
        g1History.push({ t, ...g1 });
        g1History = g1History.filter((h) => h.t >= t - 2000);
      }

      function isMoving(key, value, t) {
        if (value == null) return false;
        const recent = g1History
          .filter((h) => h.t >= t - 2000 && h[key] != null)
          .map((h) => h[key]);
        if (recent.length < 4) return value > 0.12;
        const sorted = [...recent].sort((a, b) => a - b);
        const rest = sorted[Math.floor(sorted.length * 0.25)];
        return value >= rest + 0.06;
      }

      function statsFor(key, t) {
        const recent = g1History
          .filter((h) => h.t >= t - 2000 && h[key] != null)
          .map((h) => h[key]);
        if (!recent.length) return { mean: 0, std: 0 };
        const mean = recent.reduce((a, b) => a + b, 0) / recent.length;
        const variance =
          recent.reduce((a, b) => a + (b - mean) * (b - mean), 0) /
          recent.length;
        return { mean, std: Math.sqrt(variance) };
      }

      function rememberYou(you, t) {
        if (!you) return;
        youHistory.push({ t, ...you });
        youHistory = youHistory.filter((h) => h.t >= t - 1000);
      }

      function youStatsFor(key, t) {
        const recent = youHistory
          .filter((h) => h.t >= t - 1000 && h[key] != null)
          .map((h) => h[key]);
        if (!recent.length) return { mean: 0, std: 0 };
        const mean = recent.reduce((a, b) => a + b, 0) / recent.length;
        const variance =
          recent.reduce((a, b) => a + (b - mean) * (b - mean), 0) /
          recent.length;
        return { mean, std: Math.sqrt(variance) };
      }

      function isUserMoving(t) {
        const keys = ["rPunch", "lPunch", "rReach", "lReach", "rKick", "lKick"];
        for (const key of keys) {
          const { std } = youStatsFor(key, t);
          if (std > 0.04) return true;
        }
        return false;
      }

      function speak(text, kind, now) {
        if (now - lastTalkAt < 1400 && kind === "bad") return;
        lastTalkAt = now;
        pendingErr = null;
        setTalk(text, kind);
      }

      function updateErrorChart(items) {
        const labels = items.map((i) => (i.partName || i.feature) + i.text);
        const gaps = items.map((i) => i.gap);
        const colors = items.map((i) =>
          i.gap > i.min ? "#ff5d6c" : "#3ee08f"
        );
        const el = document.getElementById("errorChart");
        if (!items.length) {
          el.innerHTML = `<h3 style="margin:0 0 0.5rem 0;font-size:14px;color:#8b97b8;">实时误差指标</h3><div style="color:#8b97b8;font-size:13px;">等待动作对齐…</div>`;
          return;
        }
        Plotly.react(
          "errorChart",
          [
            {
              x: labels,
              y: gaps,
              type: "bar",
              text: gaps.map((g) => g.toFixed(2)),
              textposition: "outside",
              marker: { color: colors },
            },
          ],
          {
            paper_bgcolor: "#141b2e",
            plot_bgcolor: "#141b2e",
            font: { color: "#e8eefc", size: 11 },
            margin: { t: 30, b: 60, l: 40, r: 20 },
            xaxis: { tickangle: -25, color: "#8b97b8" },
            yaxis: { title: "误差", color: "#8b97b8", gridcolor: "#2a3558" },
            showlegend: false,
          },
          { responsive: true, displayModeBar: false }
        );
      }

      function judge(you, g1) {
        const now = performance.now();
        rememberG1(g1, now);
        rememberYou(you, now);
        if (!you || !g1) {
          setTalk("两边骨架都要看见才能对标", "wait");
          talkMetaEl.textContent = "";
          skillFillEl.style.width = "0%";
          return;
        }
        const live = [];
        for (const spec of visualChecks(robotLm)) {
          const gv = g1[spec.g1];
          const yv = you[spec.you];
          if (gv == null || yv == null) continue;
          const gap = gv - yv;
          const maxAbs = Math.abs(gap);
          const { std } = statsFor(spec.g1, now);
          const threshold = spec.threshold;
          const significance = Math.min(maxAbs / threshold, 1.0);
          const consistency = 1.0 - Math.min(std / (threshold / 2.0), 1.0);
          const confidence = significance * 0.6 + consistency * 0.4;
          const score = maxAbs * spec.importance * confidence;
          live.push({
            feature: spec.feature,
            partName: spec.partName,
            g1v: gv,
            gap,
            maxAbs,
            std,
            threshold,
            confidence,
            score,
            text: spec.text,
            min: spec.min,
            importance: spec.importance,
          });
        }
        if (!live.length) {
          pendingErr = null;
          updateErrorChart([]);
          talkMetaEl.textContent = "";
          skillFillEl.style.width = "0%";
          return;
        }
        live.sort((a, b) => b.score - a.score);
        updateErrorChart(live);
        const top = live[0];
        const part = top.partName || top.feature;
        const primaryMessage =
          top.gap > top.min
            ? `${part}${top.text}，还差 ${top.maxAbs.toFixed(2)}，加油！`
            : `${part}已经很接近了（差距 ${top.maxAbs.toFixed(2)}），继续保持！`;
        const kind = top.gap > top.min ? "bad" : "wait";
        const userMoving = isUserMoving(now);
        if (running && userMoving) {
          danceLog.push({
            t: now,
            robotT: robot.currentTime,
            top: {
              partName: top.partName,
              feature: top.feature,
              maxAbs: top.maxAbs,
              threshold: top.threshold,
              min: top.min,
              text: top.text,
            },
            all: live.map((i) => ({
              partName: i.partName,
              feature: i.feature,
              maxAbs: i.maxAbs,
              threshold: i.threshold,
              min: i.min,
              text: i.text,
            })),
            prompt: primaryMessage,
            kind,
          });
        }
        if (!userMoving) {
          if (talkEl.textContent.trim() !== "请先跟随 G1 做动作") {
            setTalk("请先跟随 G1 做动作", "wait");
          }
          talkMetaEl.textContent = "检测到动作后会显示实时数据和技能值";
          skillFillEl.style.width = "0%";
          return;
        }
        const similarity = Math.max(0, 1 - Math.min(top.maxAbs / top.threshold, 1)) * 100;
        const skill = Math.round(similarity);
        if (talkEl.textContent !== primaryMessage) setTalk(primaryMessage, kind);
        talkMetaEl.textContent = `技能值 ${skill}% · 差距 ${top.maxAbs.toFixed(2)} · 阈值 ${top.min}`;
        skillFillEl.style.width = `${skill}%`;
        skillFillEl.style.background =
          skill > 80 ? "var(--ok)" : skill > 50 ? "var(--warn)" : "var(--bad)";
      }

      function showReport() {
        const modal = document.getElementById("reportModal");
        const content = document.getElementById("reportContent");
        if (!danceLog.length) {
          content.innerHTML = `
            <h2>舞蹈对标报告</h2>
            <p>没有采集到数据。请开始对标并跟随 G1 完成后再查看。</p>
          `;
          modal.style.display = "flex";
          return;
        }
        const parts = {};
        const bySecond = {};
        let totalFrameScore = 0;
        let frameCount = 0;
        danceLog.forEach((frame) => {
          if (!frame.all.length) return;
          const s = Math.floor(frame.robotT ?? 0);
          bySecond[s] = frame;
          let frameScore = 0;
          frame.all.forEach((item) => {
            const key = item.partName || item.feature;
            if (!parts[key]) {
              parts[key] = { gap: 0, threshold: 0, count: 0, text: item.text };
            }
            parts[key].gap += item.maxAbs;
            parts[key].threshold += item.threshold;
            parts[key].count++;
            frameScore += 1 - Math.min(item.maxAbs / item.threshold, 1);
          });
          totalFrameScore += frameScore / frame.all.length;
          frameCount++;
        });
        const overallScore =
          frameCount === 0
            ? 0
            : Math.max(
                0,
                Math.min(
                  100,
                  Math.round((totalFrameScore / frameCount) * 100)
                )
              );
        const partEntries = Object.entries(parts).map(([name, p]) => ({
          name,
          text: p.text,
          score: Math.max(
            0,
            Math.min(100, Math.round(100 - Math.min(p.gap / p.threshold, 1) * 100))
          ),
        }));
        partEntries.sort((a, b) => a.score - b.score);
        const weak = partEntries.filter((p) => p.score < 70);
        const comment =
          overallScore >= 80
            ? "整体表现很棒！动作和 G1 非常同步。"
            : overallScore >= 60
            ? "整体不错，继续加油！"
            : "继续练习，动作会越来越像！";
        const suggestionHtml = weak.length
          ? `<ul class="report-suggestions">${weak
              .slice(0, 3)
              .map(
                (p) =>
                  `<li><strong>${p.name}</strong>需要多练，试着${p.text}</li>`
              )
              .join("")}</ul>`
          : `<p>各部分都表现不错，保持练习！</p>`;
        const partHtml = partEntries
          .map((p) => `<div>${p.name}<span>${p.score}%</span></div>`)
          .join("");
        const tlHtml = Object.keys(bySecond)
          .sort((a, b) => Number(a) - Number(b))
          .map((s) => {
            const f = bySecond[s];
            const status =
              f.top.maxAbs <= f.top.min
                ? "ok"
                : f.top.maxAbs <= f.top.threshold
                ? "warn"
                : "bad";
            return `
              <div class="tl-cell ${status}">
                <div class="tl-time">第 ${Number(s) + 1} 秒</div>
                <div class="tl-prompt">${f.prompt || "—"}</div>
              </div>
            `;
          })
          .join("");
        content.innerHTML = `
          <h2>舞蹈对标报告</h2>
          <p class="report-score">${overallScore}%</p>
          <p class="report-comment">${comment}</p>
          <div class="report-parts">${partHtml}</div>
          <h3>可以提升</h3>
          ${suggestionHtml}
          <p class="report-tip">基础建议：先单独练习手臂动作，再练习腿部动作，最后把上下半身连起来。</p>
          <h3>每秒明细</h3>
          <div class="tl-grid">${tlHtml}</div>
          <p class="report-tip">图例：绿色 = 整体匹配，黄色 = 整体接近，红色 = 整体未匹配</p>
        `;
        modal.style.display = "flex";
      }

      function closeReport() {
        document.getElementById("reportModal").style.display = "none";
      }

      function fitCanvas(video, canvas) {
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (w && (canvas.width !== w || canvas.height !== h)) {
          canvas.width = w;
          canvas.height = h;
        }
        return w && h;
      }

      function xy(lm, i, canvas) {
        return [lm[i].x * canvas.width, lm[i].y * canvas.height];
      }

      function drawPose(ctx, canvas, lm, color) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!lm) return;
        ctx.lineWidth = 4;
        ctx.strokeStyle = color;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const [a, b] of BONES) {
          if (!vis(lm, a) || !vis(lm, b)) continue;
          const [x1, y1] = xy(lm, a, canvas);
          const [x2, y2] = xy(lm, b, canvas);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        for (const i of BODY12) {
          if (!vis(lm, i)) continue;
          const [x, y] = xy(lm, i, canvas);
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fillStyle = "#7cdbff";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = color;
          ctx.stroke();
        }
      }

      async function createLandmarker(vision) {
        try {
          return await PoseLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: GOOGLE_MODEL, delegate: "CPU" },
            runningMode: "VIDEO",
            numPoses: 1,
          });
        } catch {
          return PoseLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: GOOGLE_MODEL, delegate: "GPU" },
            runningMode: "VIDEO",
            numPoses: 1,
          });
        }
      }

      function isIrCamera(label) {
        return /ir\b|infrared|hello|tof|depth|红外/i.test(label || "");
      }

      async function pickColorDeviceId() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter((d) => d.kind === "videoinput");
        const sel = document.getElementById("camSelect");
        sel.innerHTML = "";
        cams.forEach((c, i) => {
          const opt = document.createElement("option");
          opt.value = c.deviceId;
          opt.textContent = c.label || `摄像头 ${i}`;
          sel.appendChild(opt);
        });
        sel.style.display = cams.length ? "block" : "none";
        const color =
          cams.find((c) => !isIrCamera(c.label)) || cams[cams.length - 1];
        if (color) sel.value = color.deviceId;
        return color ? color.deviceId : undefined;
      }

      async function openStream(deviceId) {
        const constraints = deviceId
          ? {
              video: {
                deviceId: { exact: deviceId },
                width: { ideal: 1280 },
                height: { ideal: 720 },
              },
              audio: false,
            }
          : { video: true, audio: false };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        if (cam.srcObject) cam.srcObject.getTracks().forEach((t) => t.stop());
        cam.srcObject = stream;
        await cam.play();
      }

      document.getElementById("videoSelect").onchange = (e) => {
        const path = e.target.value;
        if (!path) return;
        robot.src = path;
        robot.load();
        statusEl.textContent = "已选视频：" + path.split("/").pop();
        refreshGo();
      };

      document.getElementById("camBtn").onclick = async () => {
        try {
          await openStream();
          const id = await pickColorDeviceId();
          if (id) await openStream(id);
          statusEl.textContent = "彩色摄像头已开。模型走 Google。";
          refreshGo();
          if (!window.__visionReady) await loadModel();
        } catch (err) {
          statusEl.textContent = "打不开摄像头：" + err.message;
          setTalk("请用 Chrome，并选 FHD 摄像头，不要选 IR", "bad");
        }
      };

      document.getElementById("camSelect").onchange = async (e) => {
        await openStream(e.target.value);
      };

      function refreshGo() {
        goBtn.disabled = !(
          robot.src &&
          cam.srcObject &&
          window.__robotLmkr &&
          window.__camLmkr
        );
      }

      async function loadModel() {
        statusEl.textContent = "正在从 Google 加载姿态模型…";
        window.__vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm",
        );
        window.__robotLmkr = await createLandmarker(window.__vision);
        window.__camLmkr = await createLandmarker(window.__vision);
        window.__visionReady = true;
        statusEl.textContent =
          "模型已从 storage.googleapis.com 加载。可以开始对标。";
        refreshGo();
      }

      document.getElementById("goBtn").onclick = async () => {
        running = true;
        lastRobotT = -1;
        g1History = [];
        youHistory = [];
        danceLog = [];
        pendingErr = null;
        robot.onended = () => { if (running) stopBtn.click(); };
        await robot.play();
        setTalk("跟着 G1 做，系统在比同一时刻", "wait");
        statusEl.textContent = "对标中。点击停止可随时结束。";
        document.getElementById("stopBtn").disabled = false;
      };

      document.getElementById("stopBtn").onclick = () => {
        running = false;
        robot.pause();
        pendingErr = null;
        document.getElementById("stopBtn").disabled = true;
        setTalk("已停止", "wait");
        statusEl.textContent = "已停止。点击开始对标继续。";
        showReport();
      };

      window.addEventListener("keydown", (e) => {
        if (e.code !== "Space") return;
        e.preventDefault();
        if (robot.paused) robot.play();
        else robot.pause();
      });

      function detectPose(key, video) {
        const lmkr = window[key];
        if (!lmkr) return null;
        try {
          const res = lmkr.detectForVideo(video, performance.now());
          return res.landmarks && res.landmarks[0] ? res.landmarks[0] : null;
        } catch (err) {
          if (window.__vision && !window.__rebuilding) {
            window.__rebuilding = true;
            createLandmarker(window.__vision)
              .then((next) => {
                window[key] = next;
                window.__rebuilding = false;
              })
              .catch(() => {
                window.__rebuilding = false;
              });
          }
          return null;
        }
      }

      function loop() {
        try {
          if (
            window.__robotLmkr &&
            robot.readyState >= 2 &&
            fitCanvas(robot, robotCanvas)
          ) {
            if (robot.currentTime !== lastRobotT) {
              lastRobotT = robot.currentTime;
              robotLm = detectPose("__robotLmkr", robot);
              drawPose(robotCtx, robotCanvas, robotLm, "#ffc857");
            }
          }
          if (
            window.__camLmkr &&
            cam.readyState >= 2 &&
            fitCanvas(cam, camCanvas)
          ) {
            const t = performance.now();
            if (t !== lastCamT) {
              lastCamT = t;
              camLm = detectPose("__camLmkr", cam);
              drawPose(camCtx, camCanvas, camLm, "#3ee08f");
            }
          }
          const you = metrics(camLm);
          const g1 = metrics(robotLm);
          const armLeft = mpOnScreenLeft(robotLm, L_WR, R_WR);
          const legLeft = mpOnScreenLeft(robotLm, L_ANK, R_ANK);
          document.getElementById("rPunch").textContent =
            `${fmt(you?.rPunch)} / ${fmt(armLeft ? g1?.lPunch : g1?.rPunch)}`;
          document.getElementById("lPunch").textContent =
            `${fmt(you?.lPunch)} / ${fmt(armLeft ? g1?.rPunch : g1?.lPunch)}`;
          document.getElementById("rKick").textContent =
            `${fmt(you?.rKick)} / ${fmt(legLeft ? g1?.lKick : g1?.rKick)}`;
          document.getElementById("lKick").textContent =
            `${fmt(you?.lKick)} / ${fmt(legLeft ? g1?.rKick : g1?.lKick)}`;
          if (running) judge(you, g1);
        } catch (err) {
          statusEl.textContent = "识别循环已恢复：" + err.message;
        }
        requestAnimationFrame(loop);
      }

      loop();
    </script>

    <div id="reportModal" class="report-modal">
      <div class="report-card">
        <div id="reportContent"></div>
        <div class="report-actions">
          <button onclick="window.print()">保存 PDF / 打印</button>
          <button onclick="closeReport()">关闭</button>
        </div>
      </div>
    </div>
  </body>
</html>
